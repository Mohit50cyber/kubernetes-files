kind: ReplicaSet          # Kubernetes ReplicaSet resource create karega
apiVersion: apps/v1       # ReplicaSet ke liye apps/v1 API version use karega
metadata:                 # ReplicaSet ki identification details define karta hai
 name: nginx-replicaset   # ReplicaSet ka naam nginx-replicaset rakhega
 namespace: nginx         # ReplicaSet ko nginx namespace mein create karega
spec:                     # ReplicaSet ki desired configuration define karta hai
 replicas: 2              # Hamesha 2 matching Pods maintain karne ki koshish karega
 selector:                # ReplicaSet kin Pods ko manage karega, ye define karta hai
  matchLabels:            # Pod labels ke basis par matching karega
   app: nginx             # app=nginx label wale Pods ko match karega

 template:                # Naye Pods create karne ka template define karta hai
  metadata:               # Naye Pods ki metadata details define karta hai
   labels:                # Naye Pods ke labels define karta hai
    app: nginx            # Naye Pods ko app=nginx label assign karega

  spec:                   # Naye Pods ke containers ki configuration define karta hai
   containers:            # Har Pod ke andar containers ki list define karta hai
   - name: nginx          # Container ka naam nginx rakhega
     image: nginx:latest  # Nginx ki latest-tag container image use karega
     ports:               # Container ke declared ports ki list define karta hai
     - containerPort: 80  # Container ka port 80 declare karega
     
