kind: PersistentVolume                    # Creates a PersistentVolume resource in Kubernetes
apiVersion: v1                            # Specifies the Kubernetes API version for PersistentVolume
metadata:                                 # Defines metadata information for the PersistentVolume
 name: local-pv                           # Assigns the name local-pv to the PersistentVolume
 labels:                                  # Defines labels used to identify the PersistentVolume
  app: local                              # Assigns the label app=local to the PersistentVolume
spec:                                     # Defines the storage configuration of the PersistentVolume
 capacity:                                # Specifies the storage capacity available in the volume
  storage: 1Gi                            # Allocates 1 GiB of storage capacity
 accessModes:                             # Defines how the volume can be accessed
  - ReadWriteOnce                         # Allows read-write mounting by a single node
 persistentVolumeReclaimPolicy: Retain     # Retains the underlying storage after the PVC is deleted
 storageClassName: local-storage          # Assigns the storage class name local-storage
 hostPath:                                # Uses a directory from the Kubernetes node's filesystem
  path: /mnt/data                         # Specifies the node directory used to store data
  
