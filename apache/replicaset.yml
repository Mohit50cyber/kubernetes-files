kind: ReplicaSet                 # Creates a Kubernetes ReplicaSet resource
apiVersion: apps/v1              # Specifies the API version for ReplicaSet
metadata:                        # Defines the ReplicaSet metadata
 name: apache-replicaset         # Sets the ReplicaSet name to apache-replicaset
 namespace: apache               # Creates the ReplicaSet in the apache Namespace
spec:                            # Defines the desired ReplicaSet configuration
 replicas: 2                     # Maintains two matching Apache Pods
 selector:                       # Defines which Pods the ReplicaSet manages
  matchLabels:                   # Selects Pods based on matching labels
   app: apache                   # Matches Pods with the app=apache label

 template:                       # Defines the template for creating new Pods
  metadata:                      # Defines the metadata for the Pods
   labels:                       # Defines the labels assigned to the Pods
    app: apache                  # Assigns the app=apache label to each Pod

  spec:                          # Defines the Pod container configuration
   containers:                   # Defines the list of containers inside each Pod
   - name: apache                # Sets the container name to apache
     image: httpd:latest         # Uses the latest-tagged Apache HTTP Server image
     ports:                      # Defines the container port declarations
     - containerPort: 80         # Declares container port 80 for HTTP traffic
i
